<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="brgyGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </radialGradient>
    <linearGradient id="brgyGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="brgyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#brgyGold)" stroke="#6B4E1B" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="#15803D" stroke-width="2.5"/>
  <!-- Curved Text -->
  <path id="textCircleBrgy" d="M 100,22 A 78,78 0 1,1 99.9,22" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#14532D" letter-spacing="1">
    <textPath href="#textCircleBrgy" startOffset="50%" text-anchor="middle">
      BARANGAY CONCEPCION • VALENCIA CITY •
    </textPath>
  </text>
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="66" fill="#F0FDF4" stroke="#D4AF37" stroke-width="2"/>
  <!-- Mountain / Bukidnon Landscape silhouette -->
  <path d="M 45,120 L 75,90 L 105,115 L 130,85 L 155,120 Z" fill="url(#brgyGreen)"/>
  <!-- Blue River / Spring below -->
  <path d="M 45,120 Q 80,115 100,128 Q 125,140 155,120 L 155,145 Q 100,165 45,145 Z" fill="url(#brgyBlue)"/>
  <!-- Open Hand / Community Emblem -->
  <circle cx="100" cy="80" r="14" fill="#FCD116" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="100" cy="80" r="8" fill="#FFFBEB"/>
  <!-- Rice stalks surrounding -->
  <path d="M 55,100 C 50,80 60,60 70,55" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <path d="M 145,100 C 150,80 140,60 130,55" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>
  <!-- Stars -->
  <polygon points="100,45 102,50 107,50 103,53 105,58 100,55 95,58 97,53 93,50 98,50" fill="#D4AF37"/>
  <!-- Established Ribbon -->
  <rect x="65" y="146" width="70" height="15" rx="3" fill="#D4AF37" stroke="#6B4E1B" stroke-width="1"/>
  <text x="100" y="157" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#14532D" text-anchor="middle">BUKIDNON</text>
</svg>

