<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="70%" stop-color="#E5A910"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0038A8"/>
      <stop offset="100%" stop-color="#002166"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CE1126"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGrad)" stroke="#8B6508" stroke-width="2"/>
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="#0038A8" stroke-width="2"/>
  <!-- Circular text path -->
  <path id="textCircleValencia" d="M 100,22 A 78,78 0 1,1 99.9,22" fill="none"/>
  <text font-family="'Arial Black', Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#0038A8" letter-spacing="1.2">
    <textPath href="#textCircleValencia" startOffset="50%" text-anchor="middle">
      CITY OF VALENCIA • BUKIDNON •
    </textPath>
  </text>
  <!-- Inner Shield -->
  <circle cx="100" cy="100" r="66" fill="#F8FAFC" stroke="#E5A910" stroke-width="2"/>
  <!-- Shield Split: Top Blue, Bottom Red -->
  <path d="M 60,75 Q 100,65 140,75 L 140,105 Q 140,135 100,150 Q 60,135 60,105 Z" fill="url(#blueGrad)" stroke="#B8860B" stroke-width="2"/>
  <path d="M 60,105 Q 100,110 140,105 L 140,115 Q 140,135 100,150 Q 60,135 60,115 Z" fill="url(#redGrad)"/>
  <!-- Golden Sun / 8 Rays -->
  <circle cx="100" cy="88" r="9" fill="#FCD116" stroke="#B8860B" stroke-width="1"/>
  <!-- Sun Rays -->
  <path d="M 100,72 L 100,77 M 100,99 L 100,104 M 84,88 L 89,88 M 111,88 L 116,88 M 89,77 L 92,80 M 108,96 L 111,99 M 89,99 L 92,96 M 108,80 L 111,77" stroke="#FCD116" stroke-width="2" stroke-linecap="round"/>
  <!-- Rice Stalks (City of Golden Harvest) -->
  <path d="M 80,135 Q 90,118 100,120 Q 110,118 120,135" fill="none" stroke="#FCD116" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Stars -->
  <polygon points="75,82 77,87 82,87 78,90 80,95 75,92 70,95 72,90 68,87 73,87" fill="#FCD116"/>
  <polygon points="125,82 127,87 132,87 128,90 130,95 125,92 120,95 122,90 118,87 123,87" fill="#FCD116"/>
  <!-- Ribbon banner -->
  <rect x="70" y="148" width="60" height="13" rx="3" fill="#FFE066" stroke="#8B6508" stroke-width="1"/>
  <text x="100" y="157.5" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#002166" text-anchor="middle">OFFICIAL SEAL</text>
</svg>

